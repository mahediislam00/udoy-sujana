<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Udoy &amp; Sujana · Wedding Invitation</title>
<meta name="description" content="Wedding invitation — Sudman Sobhan (Udoy) &amp; Nishat Anjum Sujana · 20 November 2026 · RAOWA Convention Hall, Dhaka">
<meta property="og:title" content="Udoy &amp; Sujana · Wedding Invitation">
<meta property="og:description" content="20 November 2026 · 7:00 PM · RAOWA Convention Hall, Dhaka">
<meta property="og:type" content="website">
<meta property="og:image" content="/poster.jpg">
<meta name="theme-color" content="#F4F5F0">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #F4F5F0; overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* soft blurred copy of the poster fills the space around the video on wide screens */
  .backdrop { position: fixed; inset: -40px; background: url("poster.jpg") center / cover no-repeat; filter: blur(30px) brightness(1.05); opacity: .6; }

  .frame { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .player { position: relative; height: 100%; max-height: 100dvh; aspect-ratio: 9 / 16; max-width: 100vw; background: #fff; box-shadow: 0 20px 60px rgba(40, 50, 30, .2); }
  video { display: block; width: 100%; height: 100%; object-fit: contain; background: #fff; }

  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(255, 255, 255, .25); border: 0; cursor: pointer; color: #575A37; }
  .overlay[hidden] { display: none; }
  .play { width: 88px; height: 88px; border-radius: 50%; background: rgba(255, 255, 255, .9); box-shadow: 0 8px 26px rgba(60, 70, 40, .25); display: flex; align-items: center; justify-content: center; }
  .label { font-size: 14px; letter-spacing: 3px; text-transform: uppercase; background: rgba(255, 255, 255, .85); padding: 6px 14px; border-radius: 999px; }

  .ctl { position: absolute; top: 12px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .8); color: #575A37; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, .12); }
  .ctl[hidden] { display: none; }
  #mute { right: 12px; }
  button:focus-visible { outline: 2px solid #575A37; outline-offset: 3px; }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<div class="frame">
  <div class="player">
    <video id="v" src="invitation.mp4" poster="poster.jpg" playsinline preload="metadata"></video>

    <button class="overlay" id="start" type="button" aria-label="Play the invitation">
      <span class="play"><svg width="34" height="34" viewBox="0 0 24 24" fill="#575A37" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
      <span class="label" id="startLabel">Tap to open</span>
    </button>

    <button class="ctl" id="mute" type="button" aria-label="Mute" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
    </button>
  </div>
</div>
<script>
  var v = document.getElementById('v');
  var start = document.getElementById('start');
  var label = document.getElementById('startLabel');
  var mute = document.getElementById('mute');
  var wave = document.getElementById('wave');

  function play() {
    v.muted = false;
    v.play().catch(function () { v.muted = true; v.play(); });   // fall back to muted if the browser blocks sound
    start.hidden = true;
    mute.hidden = false;
  }
  start.addEventListener('click', play);

  // tap the video to pause / resume
  v.addEventListener('click', function () {
    if (v.paused) { play(); } else { v.pause(); label.textContent = 'Tap to continue'; start.hidden = false; }
  });

  // when it finishes, offer to watch again
  v.addEventListener('ended', function () { label.textContent = 'Watch again'; start.hidden = false; });

  mute.addEventListener('click', function () {
    v.muted = !v.muted;
    wave.style.display = v.muted ? 'none' : '';
    mute.setAttribute('aria-label', v.muted ? 'Unmute' : 'Mute');
  });
</script>
</body>
</html>
